<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Les Petits Plats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css"/>
  </head>

  <body>
    <header class="site-header">
      <div class="overlay" aria-hidden="true"></div>

      <div class="container">
        <nav class="navbar" aria-label="Navigation principale">
          <div class="brand">
            <span class="brand-dot" aria-hidden="true"></span>
            <span>Les Petits Plats</span><span class="plate"></span>
          </div>
        </nav>

        <div class="header">
          <h1 class="header-title">
            Cherchez parmi plus de 1500 recettes <br/>
            du quotidien, simples et délicieuses
          </h1>

          <form class="search" role="search" aria-label="Recherche de recettes">
            <label class="sr-only" for="search">Rechercher une recette, un ingrédient…</label>
            <input id="search" type="text" placeholder="Rechercher une recette, un ingrédient, …"/>
            <button type="submit" aria-label="Lancer la recherche">
              <svg class="icolens" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <circle cx="11" cy="11" r="7" stroke-width="2"></circle>
                <path d="M20 20L17 17" stroke-width="2" stroke-linecap="round"></path>
              </svg>
            </button>
          </form>
        </div>
      </div>
    </header>

    <section class="container">
      <div class="toolbar">
        <div class="filters">

          <!-- INGREDIENTS -->
          <div class="filter filter--ingredients">
            <button type="button" class="filter-btn filter-toggle">
              Ingrédients
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <path d="M6 9l6 6 6-6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </button>

            <div class="filter-panel">
              <div class="filter-search">
                <input type="text" class="filter-input" placeholder="">
                <button type="button" class="filter-clear">✕</button>
                <svg class="filter-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <circle cx="11" cy="11" r="7" stroke-width="2"></circle>
                  <path d="M20 20L17 17" stroke-width="2" stroke-linecap="round"></path>
                </svg>
              </div>
              <ul id="ingredients-options"></ul>
            </div>
          </div>

          <!-- APPAREILS (préparé pour data dynamique) -->
          <div class="filter filter--appliances">
            <button type="button" class="filter-btn filter-toggle">
              Appareils
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <path d="M6 9l6 6 6-6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </button>
            <div class="filter-panel">
              <div class="filter-search">
                <input type="text" class="filter-input" placeholder="">
                <button type="button" class="filter-clear">✕</button>
                <svg class="filter-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <circle cx="11" cy="11" r="7" stroke-width="2"></circle>
                  <path d="M20 20L17 17" stroke-width="2" stroke-linecap="round"></path>
                </svg>
              </div>
              <ul id="appliances-options"></ul>
            </div>
          </div>

          <!-- USTENSILES -->
          <div class="filter filter--ustensils">
            <button type="button" class="filter-btn filter-toggle">
              Ustensiles
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <path d="M6 9l6 6 6-6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </button>
            <div class="filter-panel">
              <div class="filter-search">
                <input type="text" class="filter-input" placeholder="">
                <button type="button" class="filter-clear">✕</button>
                <svg class="filter-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <circle cx="11" cy="11" r="7" stroke-width="2"></circle>
                  <path d="M20 20L17 17" stroke-width="2" stroke-linecap="round"></path>
                </svg>
              </div>
              <ul id="ustensils-options"></ul>
            </div>
          </div>
        </div>
        <div class="counter">1500 recettes</div>
      </div>
      <div class="tags"></div>
    </section>
    <main class="container">
      <div class="grid" id="recipes-grid"></div>
    </main>
    <div class="page-end" aria-hidden="true"></div>
    <script src="scripts/recipes.js"></script>
    <script src="scripts/app.js"></script>
  </body>
</html>
